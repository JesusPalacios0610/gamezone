<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${juego.nombre} + ' - GameZone'"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>

<header class="topbar">
    <div class="logo">🎮 GAMEZONE</div>

    <nav class="nav-links">
        <a th:href="@{/}">Tienda</a>
        <a th:href="@{/biblioteca}">Biblioteca</a>
        <a th:href="@{/carrito}">Carrito</a>
    </nav>
</header>

<main class="container-fluid px-4 px-lg-5 my-5">

    <section class="game-detail-pro">

        <div class="detail-cover">
            <img th:src="${juego.imagen}" alt="Imagen del juego">
        </div>

        <div class="detail-panel">

            <span class="category"
                  th:text="${juego.categoria != null ? juego.categoria : 'General'}">
            </span>

            <h1 th:text="${juego.nombre}"></h1>

            <p class="detail-description"
               th:text="${juego.descripcion}">
            </p>

            <div class="detail-meta">
                <span th:if="${juego.destacado != null and juego.destacado}">
                    ⭐ Destacado
                </span>

                <span th:if="${cantidadReviews > 0}">
                    📝 <span th:text="${cantidadReviews}"></span> reviews
                </span>

                <span th:if="${cantidadReviews > 0}">
                    ⭐ <span th:text="${#numbers.formatDecimal(promedioReviews,1,1)}"></span>/5
                </span>
            </div>

            <div class="detail-price-box">
                <span class="old-price"
                      th:if="${juego.descuento != null and juego.descuento > 0}">
                    S/
                    <span th:text="${#numbers.formatDecimal(juego.precio, 1, 2)}"></span>
                </span>

                <span class="price">
                    S/
                    <span th:text="${#numbers.formatDecimal(juego.precioFinal, 1, 2)}"></span>
                </span>
            </div>

            <form th:action="@{/carrito/agregar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="idJuego" th:value="${juego.id}">

                <button class="buy-btn" type="submit">
                    Agregar al carrito
                </button>
            </form>

        </div>

    </section>

    <section class="reviews-pro">

        <div class="reviews-header">
            <div>
                <h2>Opiniones de usuarios</h2>
                <p>Comparte tu experiencia con este juego.</p>
            </div>

            <div class="review-score">
                <strong th:text="${#numbers.formatDecimal(promedioReviews,1,1)}"></strong>
                <span>/5</span>
                <small th:text="${cantidadReviews} + ' reviews'"></small>
            </div>
        </div>

        <div class="row g-4">

            <div class="col-12 col-lg-4">

                <form th:action="@{/review/guardar}" method="post" class="review-form-pro">
                    <h3>Escribir review</h3>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="idJuego" th:value="${juego.id}">
                    <input type="hidden" name="juego" th:value="${juego.nombre}">

                    <label>Puntuación</label>
                    <select name="puntuacion" required>
                        <option value="5">★★★★★ Excelente</option>
                        <option value="4">★★★★☆ Muy bueno</option>
                        <option value="3">★★★☆☆ Regular</option>
                        <option value="2">★★☆☆☆ Malo</option>
                        <option value="1">★☆☆☆☆ Muy malo</option>
                    </select>

                    <label>Comentario</label>
                    <textarea name="comentario"
                              placeholder="Escribe tu reseña..."
                              required></textarea>

                    <button type="submit">
                        Publicar review
                    </button>
                </form>

            </div>

            <div class="col-12 col-lg-8">

                <div class="empty-message" th:if="${#lists.isEmpty(reviews)}">
                    Aún no hay reviews para este juego.
                </div>

                <div class="review-card-pro" th:each="r : ${reviews}">

                    <div class="review-avatar">
                        👤
                    </div>

                    <div class="review-content">

                        <div class="review-top">
                            <h3 th:text="${r.usuario}"></h3>
                            <small th:text="${r.fecha}"></small>
                        </div>

                        <div class="stars">
                            <span th:if="${r.puntuacion == 5}">★★★★★</span>
                            <span th:if="${r.puntuacion == 4}">★★★★☆</span>
                            <span th:if="${r.puntuacion == 3}">★★★☆☆</span>
                            <span th:if="${r.puntuacion == 2}">★★☆☆☆</span>
                            <span th:if="${r.puntuacion == 1}">★☆☆☆☆</span>
                        </div>

                        <p th:text="${r.comentario}"></p>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
